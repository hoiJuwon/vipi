# ~/.tmux.conf

# === Prefix 변경 ===
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
bind v copy-mode

# === 마우스 ===
set -g mouse on

# Keep every Pi session-tree sidebar at the same fixed width.
set-hook -g client-resized 'run-shell "@HOME@/.pi/agent/packages/pi-session-tree/fix-sidebar-width.sh"'
set-hook -g after-select-window 'run-shell "@HOME@/.pi/agent/packages/pi-session-tree/fix-sidebar-width.sh"'

# === 패널 이동 ===
bind [ select-pane -t :.-
bind ] select-pane -t :.+

# === 패널 분할 (직관적) ===
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# === 설정 리로드 ===
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# === 자동 윈도우 이름 변경 방지 ===
set-option -g allow-rename off

# === 윈도우/패널 번호 1부터 시작 ===
set -g base-index 1
setw -g pane-base-index 1

# vi mode
setw -g mode-keys vi

# Pi/Neovim modified-key support inside tmux
set -s extended-keys on
set -s extended-keys-format csi-u
# Remote SSH/tmux copy should go to the connected client clipboard via OSC52.
set -g set-clipboard on
set -g allow-passthrough on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# emacs mode (기본값)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pi conversation navigation remains available after zt/zb enters copy mode.
# z is a one-key prefix in copy mode: zt=latest response top, zb=bottom, zz=toggle.
bind-key -T copy-mode-vi z switch-client -T pi-conversation-nav
bind-key -T pi-conversation-nav t run-shell '@HOME@/.pi/agent/packages/pi-conversation-nav/navigate.sh top "#{pane_id}"'
bind-key -T pi-conversation-nav b run-shell '@HOME@/.pi/agent/packages/pi-conversation-nav/navigate.sh bottom "#{pane_id}"'
bind-key -T pi-conversation-nav z run-shell '@HOME@/.pi/agent/packages/pi-conversation-nav/navigate.sh toggle "#{pane_id}"'

# Restore native vi copy-mode prefixes (previous Pi REVIEW versions overrode them).
bind-key -T copy-mode-vi g send-keys -X history-top
bind-key -T copy-mode-vi 1 command-prompt -N -I 1 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 2 command-prompt -N -I 2 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 3 command-prompt -N -I 3 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 4 command-prompt -N -I 4 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 5 command-prompt -N -I 5 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 6 command-prompt -N -I 6 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 7 command-prompt -N -I 7 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 8 command-prompt -N -I 8 -p '(repeat)' { send-keys -N "%%" }
bind-key -T copy-mode-vi 9 command-prompt -N -I 9 -p '(repeat)' { send-keys -N "%%" }

# Pi explicit REVIEW mode. Press R in Pi-Vim NORMAL to enter; no live polling.
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi C-c send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi i send-keys -X cancel \; send-keys -l i
bind-key -T copy-mode-vi a send-keys -X cancel \; send-keys -l a
bind-key -T copy-mode-vi A send-keys -X cancel \; send-keys -l A
bind-key -T copy-mode-vi I send-keys -X cancel \; send-keys -l I
bind-key -T copy-mode-vi o send-keys -X cancel \; send-keys -l o
bind-key -T copy-mode-vi O send-keys -X cancel \; send-keys -l O
bind-key -T copy-mode-vi : send-keys -X cancel \; send-keys -l :
